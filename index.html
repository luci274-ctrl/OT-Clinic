<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hopewell OT Clinic Simulator V13</title>
<style>
:root{--glass:rgba(24,24,25,.78);--purple:#7359df;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,-apple-system,Arial;color:#fff}
button,select{font:inherit}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#111}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
#day{position:absolute;top:14px;left:14px;background:var(--glass);border:1px solid #ffffff18;border-radius:13px;padding:9px 12px;font-size:12px;line-height:1.4;backdrop-filter:blur(8px)}
#ethics{position:absolute;top:14px;right:14px;display:grid;gap:7px}
.metric{background:var(--glass);border:1px solid #ffffff18;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:800;backdrop-filter:blur(8px)}
#objective{position:absolute;top:82px;left:14px;display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid #ffffff18;border-radius:13px;padding:9px 12px;font-size:13px;backdrop-filter:blur(8px)}
#arrow{display:inline-block;color:var(--gold);font-size:26px;transform-origin:center}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--glass);border:1px solid #ffffff22;border-radius:999px;padding:7px 11px;font-size:12px;display:none;backdrop-filter:blur(8px)}
#toast{position:absolute;left:50%;top:132px;transform:translateX(-50%);background:#171719e8;border-radius:12px;padding:9px 12px;font-size:12px;display:none;max-width:80%;text-align:center}
#joystick{position:absolute;z-index:30;left:22px;bottom:24px;width:116px;height:116px;border:2px solid #ffffff9a;border-radius:50%;background:#ffffff12;backdrop-filter:blur(4px);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#ffffffba;box-shadow:0 4px 13px #0005}
#interact{position:absolute;z-index:30;right:22px;bottom:32px;width:94px;height:94px;border-radius:50%;border:2px solid #ffffffaa;background:#403b3888;color:#fff;font-weight:900;backdrop-filter:blur(5px)}
#creator{position:absolute;inset:0;z-index:60;background:#101113dd;padding:14px;display:grid;place-items:center;overflow:auto}
.panel{width:min(760px,100%);max-height:94vh;overflow:auto;background:#e9eaec;color:#24252a;border-radius:18px;box-shadow:0 24px 80px #0008}
.head{position:sticky;top:0;background:#4a4e54;color:#fff;padding:14px 17px;font-size:20px;font-weight:900;z-index:2}
.preview{margin:14px;height:340px;border-radius:14px;overflow:hidden;background:linear-gradient(#7e8994,#4e555d);position:relative}
#previewCanvas{width:100%;height:100%;display:block}
.opts{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#f8f8f9;border-radius:12px;padding:11px}
.opt b{display:block;margin-bottom:7px}
.opt select{width:100%;padding:10px;border-radius:9px;border:1px solid #bbb;background:#fff}
.swatches{display:flex;gap:7px;flex-wrap:wrap}.sw{width:29px;height:29px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #888}
.start{margin:0 14px 16px;width:calc(100% - 28px);padding:14px;border:0;border-radius:11px;background:var(--purple);color:#fff;font-weight:900}
.fallback{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:30px;text-align:center;background:#222}
@media(max-width:560px){.opts{grid-template-columns:1fr}.preview{height:300px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="fallback" class="fallback">Loading the 3D clinic…</div>
<div id="hud">
 <div id="day"><b>Day 1</b> &nbsp; 8:05 AM<br>⭐ XP <span id="xp">0</span> &nbsp; $<span id="money">0</span></div>
 <div id="ethics"><div class="metric">Ethics 100</div><div class="metric">Safety 100</div></div>
 <div id="objective"><span id="arrow">⬆</span><span id="objText">Go to reception</span></div>
 <div id="toast"></div><div id="hint"></div>
</div>
<div id="joystick"><div id="knob"></div></div>
<button id="interact">INTERACT</button>

<div id="creator">
 <div class="panel">
  <div class="head">CREATE YOUR OT</div>
  <div class="preview"><canvas id="previewCanvas"></canvas></div>
  <div class="opts">
   <div class="opt"><b>Hairstyle</b><select id="hairStyle"><option value="pony">Low ponytail</option><option value="bun">High bun</option><option value="bob">Bob</option><option value="short">Short crop</option><option value="waves">Long waves</option></select></div>
   <div class="opt"><b>Body</b><select id="bodyStyle"><option value="standard">Standard</option><option value="slim">Slim</option><option value="broad">Broad</option></select></div>
   <div class="opt"><b>Skin tone</b><div class="swatches" id="skins"></div></div>
   <div class="opt"><b>Hair color</b><div class="swatches" id="hairs"></div></div>
   <div class="opt"><b>Scrub color</b><div class="swatches" id="scrubs"></div></div>
   <div class="opt"><b>Eyes</b><select id="eyes"><option>Almond</option><option>Round</option><option>Soft</option></select></div>
  </div>
  <button class="start" id="start">ENTER CLINIC</button>
 </div>
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';

const canvas=document.getElementById('canvas');
const fallback=document.getElementById('fallback');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe9e4db);
scene.fog=new THREE.Fog(0xe9e4db,18,58);

const camera=new THREE.PerspectiveCamera(58,1,.1,100);
camera.position.set(0,3.4,6.4);

const hemi=new THREE.HemisphereLight(0xfff8ed,0x5e6670,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffead4,3.0);sun.position.set(-8,14,6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-10;scene.add(sun);

function box(w,h,d,color,x,y,z,rough=.75){
 const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:.02});
 const g=new THREE.BoxGeometry(w,h,d);
 const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o
}
function cyl(r,h,color,x,y,z){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),new THREE.MeshStandardMaterial({color,roughness:.7}));
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o
}

// floor + ceiling + corridor walls
box(12,.18,56,0xc6a27e,0,-.09,-22);
box(12,.16,56,0xf3efe8,0,4.9,-22);
box(.18,5,56,0xd7cec2,-6,2.4,-22);
box(.18,5,56,0xd7cec2,6,2.4,-22);

// wood floor strips
for(let x=-5.6;x<=5.6;x+=.8) box(.018,.015,56,0x9c7b60,x,.01,-22);
for(let z=5;z>=-49;z-=2.2) box(12,.012,.018,0x9c7b60,0,.012,z);

// ceiling lights
for(let z=3;z>=-48;z-=6){
 const light=new THREE.PointLight(0xfff5e8,1.1,9,2);light.position.set(0,4.55,z);scene.add(light);
 const fixture=box(1.6,.06,.7,0xffffff,0,4.76,z);fixture.material.emissive=new THREE.Color(0xffffff);fixture.material.emissiveIntensity=1.2
}

// reception zone
box(5.8,1.15,1.1,0x805a3f,-2.5,.58,1.0);
box(5.8,.16,1.18,0xd2b18f,-2.5,1.18,1.0);
box(1.0,.75,.14,0x343a40,-2.2,1.72,.46);
box(.18,.48,.18,0x444444,-2.2,1.27,.46);
box(2.8,2.9,.12,0x526b63,-5.82,2.15,1.1);
for(let i=0;i<3;i++){box(.72,.82,.7,0x625d58,2.1+i*.95,.45,-.2);box(.72,.78,.18,0x625d58,2.1+i*.95,1.12,.12)}

// plants
function plant(x,z){
 cyl(.28,.35,0x8d6b50,x,.18,z);
 for(let i=0;i<6;i++){let leaf=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),new THREE.MeshStandardMaterial({color:0x527a4d,roughness:.9}));
 leaf.scale.set(.55,1.2,.35);leaf.position.set(x+(i-2.5)*.09,.55+Math.abs(i-2.5)*.08,z);leaf.rotation.z=(i-2.5)*.3;leaf.castShadow=true;scene.add(leaf)}
}
plant(-5.1,-1.2);plant(5.0,-13);

// wall art
function art(x,z,side=1){
 const frame=box(.12,1.45,1.05,0x6f5b4c,x,2.5,z);
 if(side===1)frame.rotation.y=Math.PI/2;
 const pic=box(.13,1.15,.78,0xe7e0d6,x+(side===1?-.01:0),2.5,z);
 if(side===1)pic.rotation.y=Math.PI/2
}
art(5.88,-6);art(-5.88,-20);art(5.88,-32);

// rooms with recessed openings
function roomDoor(side,z,labelColor=0x75553e){
 const x=side*5.78;
 // doorway frame
 let a=box(.25,3.2,2.2,0xb8aa9a,x,1.6,z);
 let d=box(.16,2.75,1.72,labelColor,x-side*.16,1.42,z);
 // little window
 let w=box(.18,.85,.7,0xd6c6b5,x-side*.28,2.0,z);
 return {frame:a,door:d,window:w}
}
roomDoor(-1,-8);roomDoor(1,-15);roomDoor(-1,-24);roomDoor(1,-34);

// peds room visible through open doorway
// create opening-like bright alcove just inside right wall
box(5.5,.16,6.5,0xb8c9cb,3.0,.01,-15);
box(5.5,3.2,.14,0xd5e1dd,3.0,1.6,-18.2);
box(.14,3.2,6.5,0xd5e1dd,.3,1.6,-15);
box(.14,3.2,6.5,0xd5e1dd,5.7,1.6,-15);
box(2.7,.6,1.1,0x6fa0bc,3,.3,-16.2);
const swingTop=box(2.3,.12,.12,0x59636a,3,3.65,-14.3);
for(const sx of [2.35,3.65]){
 const rope=box(.05,2.1,.05,0x4f5960,sx,2.55,-14.3);
 rope.rotation.z=(sx<3?-0.12:0.12)
}
const swing=new THREE.Mesh(new THREE.SphereGeometry(.65,20,14),new THREE.MeshStandardMaterial({color:0x3d75a5,roughness:.6}));
swing.scale.set(1,.85,1);swing.position.set(3,1.4,-14.3);swing.castShadow=true;scene.add(swing);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.35,20,14),new THREE.MeshStandardMaterial({color:0xe0b743,roughness:.8}));
ball.position.set(4.1,.36,-15.8);ball.castShadow=true;scene.add(ball);

// adult rehab equipment
for(let i=0;i<3;i++){
 cyl(.26,.55,[0x80905f,0x7d647f,0xb28a4c][i],-3.9+i*.75,.33,-25.3)
}
box(2.3,.55,.8,0x54626c,-2.8,.35,-24.1);
box(2.1,.18,.72,0xbfcbd3,-2.8,.72,-24.1);

// parallel bars
for(const px of [-1.1,1.1]){
 for(const pz of [-27.7,-30.4])cyl(.045,1.15,0x858585,px,.58,pz);
 const bar=box(.08,.08,2.8,0x858585,px,1.12,-29.05);bar.material.metalness=.65;bar.material.roughness=.35
}

// player
const player=new THREE.Group();scene.add(player);
let skin=0xd99f77,hair=0x35241e,scrub=0x7359df;
let hairStyle='pony',bodyStyle='standard';
function mat(c,rough=.72){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function addMesh(parent,geom,material,x,y,z){
 const m=new THREE.Mesh(geom,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m
}
function rebuildCharacter(group=player){
 while(group.children.length)group.remove(group.children[0]);
 const slim=bodyStyle==='slim'?.88:bodyStyle==='broad'?1.12:1;
 // legs
 addMesh(group,new THREE.CapsuleGeometry(.15,.78,5,10),mat(0x333b47),-.2,.62,0);
 addMesh(group,new THREE.CapsuleGeometry(.15,.78,5,10),mat(0x333b47),.2,.62,0);
 addMesh(group,new THREE.BoxGeometry(.35,.15,.6),mat(0x25282a),-.2,.12,.08);
 addMesh(group,new THREE.BoxGeometry(.35,.15,.6),mat(0x25282a),.2,.12,.08);
 // torso
 const torso=addMesh(group,new THREE.CapsuleGeometry(.42*slim,.82,5,12),mat(scrub),0,1.62,0);
 torso.scale.set(1,.9,.65);
 // arms
 addMesh(group,new THREE.CapsuleGeometry(.11,.78,5,10),mat(skin),-.58*slim,1.52,0);
 addMesh(group,new THREE.CapsuleGeometry(.11,.78,5,10),mat(skin),.58*slim,1.52,0);
 // visible neck
 addMesh(group,new THREE.CylinderGeometry(.15,.17,.34,16),mat(skin),0,2.25,0);
 // head
 const head=addMesh(group,new THREE.SphereGeometry(.36,24,18),mat(skin),0,2.67,0);
 head.scale.set(.88,1.08,.88);
 // hair cap
 const cap=addMesh(group,new THREE.SphereGeometry(.38,24,16,0,Math.PI*2,0,Math.PI*.54),mat(hair,.82),0,2.84,0);
 cap.scale.set(.92,.82,.92);
 // hair BEHIND head
 if(hairStyle==='pony'){
   const pony=addMesh(group,new THREE.CapsuleGeometry(.16,.75,6,12),mat(hair,.82),0,2.25,.29);
   pony.rotation.x=.12;
 }else if(hairStyle==='bun'){
   addMesh(group,new THREE.SphereGeometry(.22,18,14),mat(hair,.82),0,3.18,.02);
 }else if(hairStyle==='bob'){
   const back=addMesh(group,new THREE.CapsuleGeometry(.32,.48,5,12),mat(hair,.82),0,2.48,.18);back.scale.z=.72
 }else if(hairStyle==='waves'){
   for(const ox of [-.25,0,.25]){const q=addMesh(group,new THREE.CapsuleGeometry(.12,.72,5,10),mat(hair,.82),ox,2.26,.22);q.rotation.z=ox*1.1}
 }
 // badge
 addMesh(group,new THREE.BoxGeometry(.18,.25,.035),mat(0xffffff),.28,1.78,-.39);
 group.rotation.y=Math.PI; // character faces down corridor
}
rebuildCharacter();

player.position.set(0,0,4.2);

// NPC Maria
const maria=new THREE.Group();scene.add(maria);
function buildNPC(group,skinC,hairC,shirtC){
 while(group.children.length)group.remove(group.children[0]);
 addMesh(group,new THREE.CapsuleGeometry(.14,.72,5,10),mat(0x4a5159),-.18,.6,0);
 addMesh(group,new THREE.CapsuleGeometry(.14,.72,5,10),mat(0x4a5159),.18,.6,0);
 let torso=addMesh(group,new THREE.CapsuleGeometry(.4,.72,5,12),mat(shirtC),0,1.52,0);torso.scale.z=.65;
 addMesh(group,new THREE.CylinderGeometry(.14,.16,.32,16),mat(skinC),0,2.13,0);
 let head=addMesh(group,new THREE.SphereGeometry(.35,22,16),mat(skinC),0,2.52,0);head.scale.y=1.08;
 addMesh(group,new THREE.SphereGeometry(.36,22,14,0,Math.PI*2,0,Math.PI*.5),mat(hairC),0,2.69,0);
}
buildNPC(maria,0xc99774,0xa8a49e,0x8f7393);
maria.position.set(2.6,0,-2.0);
maria.rotation.y=Math.PI;

const interactables=[
 {id:'reception',pos:new THREE.Vector3(-2.5,0,1.2),label:'Reception',stage:0},
 {id:'chart',pos:new THREE.Vector3(-2.2,0,-1.1),label:'Chart Computer',stage:1},
 {id:'maria',pos:new THREE.Vector3(2.6,0,-2.0),label:'Maria',stage:2},
 {id:'peds',pos:new THREE.Vector3(4.9,0,-15),label:'Peds Gym',stage:3}
];
let stage=0,xp=0,money=0,near=null,started=false;
const objText=document.getElementById('objText'),arrow=document.getElementById('arrow'),hint=document.getElementById('hint'),toast=document.getElementById('toast');
function target(){
 if(stage===0)return interactables[0];
 if(stage===1)return interactables[1];
 if(stage===2)return interactables[2];
 return interactables[3]
}
function updateObjective(){
 const t=target();
 objText.textContent=stage===0?'Go to reception':stage===1?"Review Maria's chart":stage===2?'Meet Maria':'Enter Peds Gym';
 const to=t.pos.clone().sub(player.position);const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 const angle=Math.atan2(to.x,-to.z)*180/Math.PI;
 arrow.style.transform=`rotate(${angle}deg)`;
}
function showToast(s){toast.textContent=s;toast.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display='none',1700)}

let joyX=0,joyY=0,drag=false;
const joy=document.getElementById('joystick'),knob=document.getElementById('knob');
function setJoy(cx,cy){
 const r=joy.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
 let dx=cx-mx,dy=cy-my,d=Math.hypot(dx,dy),max=38;if(d>max){dx*=max/d;dy*=max/d}
 knob.style.transform=`translate(${dx}px,${dy}px)`;joyX=dx/max;joyY=dy/max
}
joy.addEventListener('pointerdown',e=>{drag=true;joy.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(drag)setJoy(e.clientX,e.clientY)});
function endJoy(){drag=false;joyX=joyY=0;knob.style.transform=''}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);

document.getElementById('interact').addEventListener('click',()=>{
 if(!near){showToast('Move closer');return}
 if(near.id==='reception'&&stage===0){stage=1;xp+=10;showToast('Clocked in ✓');}
 else if(near.id==='chart'&&stage===1){stage=2;xp+=10;showToast("Maria's chart reviewed ✓")}
 else if(near.id==='maria'&&stage===2){stage=3;xp+=10;showToast('Maria is ready for therapy')}
 else if(near.id==='peds'&&stage===3){xp+=20;showToast('Entered treatment room ✓')}
 document.getElementById('xp').textContent=xp;updateObjective()
});

const creator=document.getElementById('creator');
function addSwatches(id,colors,setter){
 const el=document.getElementById(id);
 for(const c of colors){const b=document.createElement('button');b.className='sw';b.style.background=c;b.addEventListener('click',()=>{setter(parseInt(c.slice(1),16));rebuildCharacter();renderPreview()});el.appendChild(b)}
}
addSwatches('skins',['#f0c9aa','#dfa77f','#c58c65','#a86f50','#825139','#5d382a'],v=>skin=v);
addSwatches('hairs',['#171313','#35241e','#553526','#7b5132','#a66f42','#d3bc91'],v=>hair=v);
addSwatches('scrubs',['#7359df','#638eb9','#c06e8f','#689878','#3f608c','#8d69a8','#477f83'],v=>scrub=v);
document.getElementById('hairStyle').addEventListener('change',e=>{hairStyle=e.target.value;rebuildCharacter();renderPreview()});
document.getElementById('bodyStyle').addEventListener('change',e=>{bodyStyle=e.target.value;rebuildCharacter();renderPreview()});
document.getElementById('start').addEventListener('click',()=>{creator.style.display='none';started=true;updateObjective()});

// preview 3D renderer
const pc=document.getElementById('previewCanvas');
const pr=new THREE.WebGLRenderer({canvas:pc,antialias:true,alpha:true});pr.setPixelRatio(Math.min(devicePixelRatio,2));pr.outputColorSpace=THREE.SRGBColorSpace;pr.toneMapping=THREE.ACESFilmicToneMapping;
const ps=new THREE.Scene();const pcam=new THREE.PerspectiveCamera(45,1,.1,20);pcam.position.set(0,1.7,6.5);
ps.add(new THREE.HemisphereLight(0xffffff,0x47505a,2.4));const pl=new THREE.DirectionalLight(0xffead6,2);pl.position.set(-3,5,5);ps.add(pl);
const pg=new THREE.Group();ps.add(pg);
function rebuildPreview(){
 while(pg.children.length)pg.remove(pg.children[0]);
 // temporarily rebuild into pg using same values
 const old=player;
 const slim=bodyStyle==='slim'?.88:bodyStyle==='broad'?1.12:1;
 addMesh(pg,new THREE.CapsuleGeometry(.15,.78,5,10),mat(0x333b47),-.2,.62,0);
 addMesh(pg,new THREE.CapsuleGeometry(.15,.78,5,10),mat(0x333b47),.2,.62,0);
 addMesh(pg,new THREE.BoxGeometry(.35,.15,.6),mat(0x25282a),-.2,.12,.08);addMesh(pg,new THREE.BoxGeometry(.35,.15,.6),mat(0x25282a),.2,.12,.08);
 let t=addMesh(pg,new THREE.CapsuleGeometry(.42*slim,.82,5,12),mat(scrub),0,1.62,0);t.scale.set(1,.9,.65);
 addMesh(pg,new THREE.CapsuleGeometry(.11,.78,5,10),mat(skin),-.58*slim,1.52,0);addMesh(pg,new THREE.CapsuleGeometry(.11,.78,5,10),mat(skin),.58*slim,1.52,0);
 addMesh(pg,new THREE.CylinderGeometry(.15,.17,.34,16),mat(skin),0,2.25,0);
 let h=addMesh(pg,new THREE.SphereGeometry(.36,24,18),mat(skin),0,2.67,0);h.scale.set(.88,1.08,.88);
 let cap=addMesh(pg,new THREE.SphereGeometry(.38,24,16,0,Math.PI*2,0,Math.PI*.54),mat(hair,.82),0,2.84,0);cap.scale.set(.92,.82,.92);
 if(hairStyle==='pony'){let q=addMesh(pg,new THREE.CapsuleGeometry(.16,.75,6,12),mat(hair,.82),0,2.25,.29);q.rotation.x=.12}
 else if(hairStyle==='bun')addMesh(pg,new THREE.SphereGeometry(.22,18,14),mat(hair,.82),0,3.18,.02);
 else if(hairStyle==='bob'){let q=addMesh(pg,new THREE.CapsuleGeometry(.32,.48,5,12),mat(hair,.82),0,2.48,.18);q.scale.z=.72}
 else if(hairStyle==='waves'){for(const ox of [-.25,0,.25]){let q=addMesh(pg,new THREE.CapsuleGeometry(.12,.72,5,10),mat(hair,.82),ox,2.26,.22);q.rotation.z=ox*1.1}}
 pg.rotation.y=Math.PI;
}
function renderPreview(){
 rebuildPreview();
 const r=pc.getBoundingClientRect();pr.setSize(r.width,r.height,false);pcam.aspect=r.width/r.height;pcam.updateProjectionMatrix();pr.render(ps,pcam)
}
setTimeout(renderPreview,30);

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);
 if(started){
   const speed=4.2;
   player.position.x+=joyX*speed*dt;
   player.position.z+=joyY*speed*dt;
   player.position.x=THREE.MathUtils.clamp(player.position.x,-4.7,4.7);
   player.position.z=THREE.MathUtils.clamp(player.position.z,-46,4.5);

   // walking animation
   const moving=Math.hypot(joyX,joyY)>.1;
   if(moving){
     player.rotation.y=Math.atan2(joyX,joyY)+Math.PI;
     player.position.y=Math.abs(Math.sin(performance.now()*.009))*.035;
   }else player.position.y=0;

   // third person follow camera
   const behind=new THREE.Vector3(0,3.0,5.2).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y-Math.PI);
   const wanted=player.position.clone().add(behind);
   camera.position.lerp(wanted,1-Math.pow(.002,dt));
   const look=player.position.clone().add(new THREE.Vector3(0,1.7,0));
   camera.lookAt(look);

   // near target
   near=null;let best=999;
   for(const it of interactables){
     const d=player.position.distanceTo(it.pos);
     if(d<best){best=d;near=it}
   }
   if(best<2.0){hint.style.display='block';hint.textContent='Interact: '+near.label}else{near=null;hint.style.display='none'}
   updateObjective();
 }
 renderer.render(scene,camera)
}
function resize(){
 const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();
 renderPreview()
}
addEventListener('resize',resize);resize();
fallback.style.display='none';
animate();
</script>
</body>
</html>
