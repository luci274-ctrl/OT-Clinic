<html lang="en">
<head>

<title>OT Life: Clinical Simulator</title>
<style>
:root{

 --soft:#f0ebff;--blue:#eaf4ff;--shadow:0 14px 38px rgba(56,42,87,.10)
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f5f2fb,#fff7fa 48%,#eef8ff);color:var(--ink);min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.shell{max-width:1020px;margin:auto;padding:16px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.logo{font-weight:950;font-size:1.32rem;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:.86rem;font-weight:800;box-shadow:0 4px 12px rgba(40,30,60,.05)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{padding:30px}
h1,h2,h3,p{margin-top:0} h1{font-size:clamp(2rem,6vw,3.65rem);line-height:.98;letter-spacing:-.055em;margin-bottom:13px}
h2{font-size:1.45rem;letter-spacing:-.025em} h3{font-size:1.03rem}
.muted{color:var(--muted);line-height:1.55}.small{font-size:.89rem}.tiny{font-size:.79rem}
.kicker{display:inline-block;background:var(--soft);color:#5f42bd;font-size:.78rem;font-weight:900;padding:6px 9px;border-radius:999px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.btn{width:100%;border:none;border-radius:15px;padding:13px 15px;margin:6px 0;background:#f0ecfa;color:var(--ink);font-weight:800;text-align:left;transition:.12s}
.btn:hover{transform:translateY(-1px);filter:brightness(.99)} .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;text-align:center}
.btn.secondary{background:#fff;border:1px solid var(--line);text-align:center}.btn.danger{background:#ffe7ec;color:#8b263d}
.btn.selected{outline:3px solid #9b84f1;background:#eee8ff}.btn:disabled{cursor:default;transform:none;opacity:.84}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:#faf8fd;border:1px solid #ece6f3;border-radius:17px;padding:14px}.metric b{font-size:1.2rem}
.progress{height:10px;background:#ece8f2;border-radius:999px;overflow:hidden;margin:8px 0 16px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),#e883af)}
.client{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:14px;border-radius:18px;background:#faf8fd;margin-bottom:15px}
.avatar{width:72px;height:72px;border-radius:21px;background:linear-gradient(135deg,#ded3ff,#ffd9e8);display:grid;place-items:center;font-size:2.15rem}
.chart{background:#fbfafc;border:1px solid var(--line);border-radius:18px;padding:16px}.chart dl{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}.chart dt{font-weight:900;color:#5f5868}.chart dd{margin:0}
.notice{padding:13px 14px;border-radius:14px;margin:12px 0;line-height:1.45}.good{background:#e2f6ed;color:#176248}.bad{background:#ffe5eb;color:#81233a}.warn{background:#fff2d7;color:#72500c}.info{background:#edf4ff;color:#315c91}
.check{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:14px;margin:7px 0;background:#fff}.check input{margin-top:3px;transform:scale(1.18)}
textarea,input[type=text]{width:100%;border:1px solid #d9d2e3;border-radius:13px;padding:12px;background:#fff;color:var(--ink)} textarea{min-height:105px;resize:vertical}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:none;background:#eee9f7;border-radius:999px;padding:8px 11px;font-weight:800}.tab.active{background:var(--accent);color:#fff}
.casegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.casecard{border:1px solid var(--line);border-radius:19px;padding:16px;background:#fff}
.locked{opacity:.55;filter:grayscale(.4)}.casecard .emoji{font-size:1.75rem}
.scorebig{font-size:3.5rem;font-weight:950;letter-spacing:-.06em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
kbd{background:#f3f0f7;border:1px solid #ddd5e6;border-bottom-width:2px;padding:2px 5px;border-radius:6px}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding-top:10px}
@media(max-width:700px){.row,.row3,.casegrid{grid-template-columns:1fr}.chart dl{grid-template-columns:1fr;gap:2px}.chart dd{margin-bottom:8px}.client{grid-template-columns:58px 1fr}.avatar{width:58px;height:58px}.hero{padding:22px}.card{padding:18px}}
</style>
</head>

   <div class="metric"><b>${state.completed.length}</b><br><span class="small muted">cases completed</span></div>
   <div class="metric"><b>${state.xp}</b><br><span class="small muted">career XP</span></div>
   <div class="metric"><b>${state.level}</b><br><span class="small muted">clinician level</span></div>
 </div>
 </section>
 <section class="card">
  <h2>Career progression</h2>
  <p class="muted small">New settings unlock as you earn XP. Replaying a case still earns practice XP, but the first completion gives the largest reward.</p>
  <div class="progress"><div class="bar" style="width:${Math.min(100,(state.xp%100))}%"></div></div>
  <div class="small">Next clinician level at <b>${Math.ceil((state.xp+1)/100)*100} XP</b>.</div>
 </section>`);
}
function howto(){
 app(`<section class="card">
 <div class="kicker">Orientation</div><h2>Your job</h2>
 <p class="muted">You play the occupational therapist. Each case moves through a simplified OT process. Strong choices earn Clinical Reasoning Points (CRP). Unsafe, non-client-centered, out-of-scope, or unethical choices reduce your shift score.</p>
 <div class="chart"><dl>
 <dt>1. Chart review</dt><dd>Read diagnosis, precautions, referral, prior level, and client goal.</dd>
 <dt>2. Occupational profile</dt><dd>Identify occupations and contexts that matter to the client.</dd>
 <dt>3. Evaluation</dt><dd>Select relevant assessments and interpret functional observations.</dd>
 <dt>4. Goal writing</dt><dd>Choose a measurable, occupation-focused goal.</dd>
 <dt>5. Intervention</dt><dd>Select interventions that connect to goals and occupational performance.</dd>
 <dt>6. Ethics & safety</dt><dd>Handle confidentiality, scope, boundaries, emergencies, and client rights.</dd>
 <dt>7. Documentation</dt><dd>Write a short SOAP note. The game looks for clinically useful elements, not exact wording.</dd>
 <dt>8. Outcomes</dt><dd>Choose a safe, client-centered discharge/transition plan.</dd>
 </dl></div>
 <div class="notice info small"><b>Classroom note:</b> This game intentionally simplifies real practice. Facility policy, state law, payer rules, supervision requirements, physician orders, and actual assessment manuals can change what is appropriate in a real case.</div>
 <button class="btn primary" onclick="clinic()">Go to Clinic</button>
 <button class="btn secondary" onclick="home()">Main Menu</button>
 </section>`);
}
function clinic(){
 const cards=CASES.map(c=>{
  const locked=state.xp<c.unlock;
  const done=state.completed.includes(c.id);
  return `<div class="casecard ${locked?'locked':''}">
   <div class="emoji">${c.emoji}</div><h3>${c.name}</h3>
   <div class="small muted">${c.setting}</div><p class="small">${c.dx}</p>
   ${locked?`<div class="notice warn tiny">🔒 Unlocks at ${c.unlock} XP</div>`:`<div class="tiny">${done?'✅ Completed':'🆕 New case'}</div>
   <button class="btn primary" onclick="startCase('${c.id}')">${done?'Replay Case':'Open Chart'}</button>`}
  </div>`
 }).join("");
 app(`<section class="card">
 <div class="kicker">Clinic dashboard</div><h2>Today's Caseload</h2>
 <p class="muted">Pick a client. Higher-XP settings unlock as your clinical career progresses.</p>
 <div class="casegrid">${cards}</div>
 <hr><button class="btn secondary" onclick="resetCareer()">Reset Career</button>
 <button class="btn secondary" onclick="home()">Main Menu</button>
 </section>`);
}
function resetCareer(){
 if(confirm("Reset all OT Life XP, money, and completed cases?")){
  state={xp:0,money:0,level:1,clin:100,ethics:100,safety:100,rapport:100,completed:[],name:"Student OT"};save();home();
 }
}
function startCase(id){
 const c=CASES.find(x=>x.id===id);
 run={id,c,stage:0,points:0,max:0,ethics:100,safety:100,rapport:100,selectedAssess:[],selectedInterv:[],notes:{},feedback:[]};
 chart();
}
function stageHeader(title,n){
 return `<div class="kicker">Case ${run.c.name} • Step ${n}/8</div>
 <div class="progress"><div class="bar" style="width:${(n-1)/8*100}%"></div></div><h2>${title}</h2>`;
}
function chart(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Chart Review",1)}
 <div class="client"><div class="avatar">${c.emoji}</div><div><h2 style="margin:0">${c.name}, ${c.age}</h2><div class="muted">${c.setting}</div></div></div>
 <div class="chart"><dl>
 <dt>Diagnosis</dt><dd>${c.dx}</dd>
 <dt>Precautions</dt><dd>${c.precautions}</dd>
 <dt>Reason for OT</dt><dd>${c.reason}</dd>
 <dt>Prior function</dt><dd>${c.prior}</dd>
 <dt>Client-stated goal</dt><dd>“${c.goal}”</dd>
 </dl></div>
 <div class="notice info small"><b>Clinical reasoning:</b> Before doing anything, connect the referral and precautions to what the client wants and needs to do.</div>
 <button class="btn primary" onclick="profile()">Begin Occupational Profile</button>
 </section>`);
}
function profile(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Occupational Profile",2)}
 <p class="muted">Which areas belong in this client's occupational profile? Select all that are meaningful to this case.</p>
 ${[...c.profile,"Unrelated celebrity trivia","Your personal opinion of the diagnosis"].map((x,i)=>`<label class="check"><input type="checkbox" data-prof="${i}"><span>${x}</span></label>`).join("")}
 <button class="btn primary" onclick="scoreProfile()">Save Profile Priorities</button></section>`);
}
function scoreProfile(){
 let sel=[...document.querySelectorAll("[data-prof]:checked")].map(x=>+x.dataset.prof);
 let score=0,max=3;
 sel.forEach(i=>{if(i<run.c.profile.length)score+=.6;else score-=1});
 score=Math.max(0,Math.min(3,score));run.points+=score;run.max+=max;
 evalAssess(score>=2.4);
}
function evalAssess(good){
 const c=run.c;
 app(`<section class="card">${stageHeader("Evaluation & Assessment",3)}
 ${good?`<div class="notice good">✅ Strong profile: you centered meaningful occupations and roles.</div>`:`<div class="notice warn">Your profile could have been more focused on occupations relevant to the client.</div>`}
 <p class="muted">Choose up to <b>4</b> evaluation methods. Strong choices should answer the referral question and help analyze occupational performance.</p>
 ${c.assessments.map((a,i)=>`<label class="check"><input type="checkbox" data-ass="${i}" onchange="limitChecks('ass',4)"><span><b>${a[0]}</b></span></label>`).join("")}
 <button class="btn primary" onclick="scoreAssess()">Complete Assessment Plan</button></section>`);
}
function limitChecks(type,max){
 const xs=[...document.querySelectorAll(`[data-${type}]:checked`)];
 if(xs.length>max){xs[xs.length-1].checked=false;alert(`Choose up to ${max}.`)}
}
function scoreAssess(){
 const chosen=[...document.querySelectorAll("[data-ass]:checked")].map(x=>+x.dataset.ass);
 if(!chosen.length){alert("Choose at least one assessment.");return}
 let pts=chosen.reduce((s,i)=>s+run.c.assessments[i][1],0);
 const max=12;run.points+=Math.min(max,pts);run.max+=max;
 const explanations=chosen.map(i=>`<li><b>${run.c.assessments[i][0]}:</b> ${run.c.assessments[i][2]}</li>`).join("");
 const ev=run.c.evalEvent;
 app(`<section class="card">${stageHeader("Interpret Findings",3)}
 <div class="notice info"><b>Your assessment plan</b><ul>${explanations}</ul></div>
 <h3>${ev.q}</h3>
 ${ev.a.map((a,i)=>`<button class="btn" onclick="singleChoice('eval',${i})">${a[0]}</button>`).join("")}
 </section>`);
}
function singleChoice(kind,i){
 let item, next;
 if(kind==="eval"){item=run.c.evalEvent.a[i];next=goals}
 if(kind==="goal"){item=run.c.goalChoices[i];next=intervention}
 if(kind==="ethics"){item=run.c.ethics.a[i];next=safety}
 if(kind==="safety"){item=run.c.emergency.a[i];next=soap}
 if(kind==="discharge"){item=run.c.discharge.a[i];next=finish}
 let pts=item[1];run.points+=pts;run.max+=3;
 if(kind==="ethics"&&pts<3)run.ethics-=20;
 if(kind==="safety"&&pts<3)run.safety-=25;
 if((kind==="eval"||kind==="goal")&&pts<3)run.rapport-=8;
 const msg=item[2]|| (pts===3?"Strong clinical choice.":pts===1?"Partly reasonable, but not the strongest occupation-focused option.":"This choice does not fit the case well.");
 app(`<section class="card">
 ${stageHeader(kind==="goal"?"Goal Review":kind==="ethics"?"Ethics Review":kind==="safety"?"Safety Review":kind==="discharge"?"Outcome Review":"Clinical Reasoning Review", kind==="goal"?4:kind==="ethics"?6:kind==="safety"?6:kind==="discharge"?8:3)}
 <div class="notice ${pts===3?'good':pts===0?'bad':'warn'}"><b>${pts===3?'✅ Strong decision':pts===0?'⚠️ Clinical concern':'🟡 Partly appropriate'}</b><br>${msg}</div>
 <button class="btn primary" onclick="${next.name}()">Continue</button></section>`);
}
function goals(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Plan of Care: Goals",4)}
 <p class="muted">Choose the strongest OT goal. Look for a meaningful occupation, measurable performance, conditions/supports, and a time frame.</p>
 ${c.goalChoices.map((g,i)=>`<button class="btn" onclick="singleChoice('goal',${i})">${g[0]}</button>`).join("")}
 </section>`);
}
function intervention(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Intervention Session",5)}
 <p class="muted">Build today's treatment session. Choose up to <b>3</b> interventions.</p>
 ${c.interventions.map((x,i)=>`<label class="check"><input type="checkbox" data-int="${i}" onchange="limitChecks('int',3)"><span>${x[0]}</span></label>`).join("")}
 <button class="btn primary" onclick="scoreInterv()">Treat Client</button></section>`);
}
function scoreInterv(){
 const chosen=[...document.querySelectorAll("[data-int]:checked")].map(x=>+x.dataset.int);
 if(!chosen.length){alert("Choose at least one intervention.");return}
 let pts=chosen.reduce((s,i)=>s+run.c.interventions[i][1],0);run.points+=Math.min(9,pts);run.max+=9;
 if(pts<5)run.rapport-=8;
 ethics();
}
function ethics(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Professional Ethics",6)}
 <div class="notice info small"><b>Think like an OT:</b> protect client welfare, avoid harm, respect autonomy, act fairly, communicate truthfully, and maintain professional responsibilities.</div>
 <h3>${c.ethics.q}</h3>
 ${c.ethics.a.map((a,i)=>`<button class="btn" onclick="singleChoice('ethics',${i})">${a[0]}</button>`).join("")}
 </section>`);
}
function safety(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Unexpected Safety Event",6)}
 <h3>${c.emergency.q}</h3>
 ${c.emergency.a.map((a,i)=>`<button class="btn" onclick="singleChoice('safety',${i})">${a[0]}</button>`).join("")}
 </section>`);
}
function soap(){
 const c=run.c;
 app(`<section class="card">${stageHeader("SOAP Documentation",7)}
 <p class="muted">Write a short note from the case. This is a learning exercise: the game checks for useful elements, not exact wording.</p>
 <h3>S — Subjective</h3><textarea id="S" placeholder="What did the client/caregiver report?"></textarea>
 <h3>O — Objective</h3><textarea id="O" placeholder="What skilled intervention/performance was observed? Include measurable details when possible."></textarea>
 <h3>A — Assessment</h3><textarea id="A" placeholder="Your clinical interpretation of performance, progress, barriers, and skilled need."></textarea>
 <h3>P — Plan</h3><textarea id="P" placeholder="What is the next OT plan?"></textarea>
 <button class="btn primary" onclick="scoreSoap()">Submit SOAP Note</button></section>`);
}
function keywordScore(text,words){
 const t=text.toLowerCase();return Math.min(3,words.reduce((s,w)=>s+(t.includes(w)?1:0),0));
}
function scoreSoap(){
 let total=0, details=[];
 for(const sec of ["S","O","A","P"]){
  const text=document.getElementById(sec).value.trim();
  if(text.length<8){alert(`Add a little more detail to section ${sec}.`);return}
  const pts=keywordScore(text,run.c.soap[sec]);
  total+=pts;details.push(`${sec}: ${pts}/3`);
 }
 run.points+=total;run.max+=12;
 app(`<section class="card">${stageHeader("Documentation Feedback",7)}
 <div class="notice ${total>=9?'good':total>=6?'warn':'bad'}"><b>SOAP structure score: ${total}/12</b><br>${details.join(" • ")}</div>
 <p class="muted small">A real note is judged on accuracy, skilled-service description, client response, measurable performance, clinical reasoning, plan-of-care requirements, and facility/payer rules—not just keywords.</p>
 <button class="btn primary" onclick="discharge()">Go to Outcome Planning</button></section>`);
}
function discharge(){
 const c=run.c;
 app(`<section class="card">${stageHeader("Outcomes & Discharge",8)}
 <h3>${c.discharge.q}</h3>
 ${c.discharge.a.map((a,i)=>`<button class="btn" onclick="singleChoice('discharge',${i})">${a[0]}</button>`).join("")}
 </section>`);
}
function finish(){
 const pct=Math.round((run.points/run.max)*100);
 const first=!state.completed.includes(run.id);
 const xp=Math.max(15,Math.round(pct*.6)+(first?25:0));
 const money=Math.max(10,Math.round(pct*.35));
 state.xp+=xp;state.money+=money;if(first)state.completed.push(run.id);save();calcLevel();
 let rank=pct>=92?"Clinical Star":pct>=82?"Strong OT Thinker":pct>=70?"Developing Clinician":"Needs More Supervision";
 app(`<section class="card">
 <div class="kicker">Case complete</div><div class="scorebig">${pct}%</div><h1 style="font-size:2.2rem">${rank}</h1>
 <p class="muted">You completed ${run.c.name}'s case in ${run.c.setting}.</p>
 <div class="row3">
  <div class="metric"><b>${run.ethics}</b><br><span class="small muted">Ethics</span></div>
  <div class="metric"><b>${run.safety}</b><br><span class="small muted">Safety</span></div>
  <div class="metric"><b>${run.rapport}</b><br><span class="small muted">Client rapport</span></div>
 </div>
 <div class="notice good"><b>Rewards:</b> +${xp} XP &nbsp; • &nbsp; +$${money} clinic funds ${first?'• First-completion bonus':''}</div>
 <button class="btn primary" onclick="clinic()">Return to Caseload</button>
 <button class="btn secondary" onclick="startCase('${run.id}')">Replay This Case</button>
 <button class="btn secondary" onclick="copyResult(${pct},'${rank.replace(/'/g,"")}')">Copy Result for Class</button>
 </section>`);
}
function copyResult(pct,rank){
 const t=`OT Life Clinical Simulator — ${run.c.name} (${run.c.setting})\nScore: ${pct}% — ${rank}\nEthics: ${run.ethics} | Safety: ${run.safety} | Rapport: ${run.rapport}`;
 navigator.clipboard?.writeText(t).then(()=>alert("Result copied!")).catch(()=>prompt("Copy your result:",t));
}
home();
</script>
</body>
</html>
