<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hopewell OT Clinic Simulator V12</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,-apple-system,Arial;color:#fff}
button,select{font:inherit}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#d7d0c6}
#world{position:absolute;inset:0;overflow:hidden;perspective:720px;background:linear-gradient(#eeeae3 0 27%,#d9c5aa 27% 100%)}
.ceiling{position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(#f6f4ef,#e9e5de);clip-path:polygon(0 0,100% 0,74% 100%,26% 100%)}
.light{position:absolute;width:11%;height:1.2%;left:44.5%;background:#fff;border-radius:50%;box-shadow:0 0 12px #fff}
.l1{top:8%}.l2{top:15%;width:8%;left:46%}.l3{top:21%;width:5%;left:47.5%}
.floor{position:absolute;left:0;right:0;top:27%;bottom:0;background:
linear-gradient(90deg,transparent 49.7%,rgba(90,65,48,.18) 50%,transparent 50.3%),
repeating-linear-gradient(90deg,rgba(85,61,43,.18) 0 1px,transparent 1px 80px),
repeating-linear-gradient(0deg,rgba(85,61,43,.2) 0 1px,transparent 1px 62px),
linear-gradient(#d8bea0,#c9a783)}
.wallL,.wallR{position:absolute;top:20%;bottom:0;width:28%;background:linear-gradient(#e9e5dc,#ddd5c9);z-index:2}
.wallL{left:0;clip-path:polygon(0 0,100% 13%,72% 100%,0 100%)}
.wallR{right:0;clip-path:polygon(0 13%,100% 0,100% 100%,28% 100%)}
.base{position:absolute;bottom:0;height:1.2%;background:#80776e;width:100%}
.door{position:absolute;background:#8a6549;border:7px solid #6e523e;box-shadow:0 5px 15px #0002;z-index:4}
.door:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#d5c19d;right:8px;top:48%}
.d1{right:3%;top:30%;width:19%;height:31%}.d2{left:4%;top:37%;width:18%;height:29%}
.sign{position:absolute;z-index:5;font-weight:800;color:#38332f;letter-spacing:.5px;font-size:12px}
.s1{right:7%;top:27%}.s2{left:6%;top:34%}
.reception{position:absolute;z-index:5;left:5%;top:31%;width:32%;height:22%;background:linear-gradient(90deg,#8a6549,#b58b67);border-radius:4px 4px 42px 4px;box-shadow:0 12px 25px #0003}
.reception:before{content:"";position:absolute;inset:8px 8px auto 8px;height:20%;background:#d9bea0;border-radius:3px 3px 25px 3px}
.monitor{position:absolute;z-index:6;left:17%;top:29%;width:11%;height:8%;background:#29323a;border:7px solid #4d5459}
.monitor:after{content:"";position:absolute;left:43%;top:100%;width:14%;height:28px;background:#444}
.logo{position:absolute;z-index:6;left:6%;top:22%;font-weight:800;color:#65746c;font-size:17px}
.logo small{display:block;font-size:9px;font-weight:600;margin-top:4px}
.plant{position:absolute;z-index:5;left:2%;top:39%;font-size:55px;filter:saturate(.65)}
.chairs{position:absolute;z-index:5;right:20%;top:40%;display:flex;gap:8px}
.chair{width:38px;height:72px;background:#625e5a;border-radius:8px 8px 3px 3px;box-shadow:0 5px 8px #0002}
.frame{position:absolute;z-index:5;border:5px solid #766254;background:#f4f0e7;padding:9px;color:#7f977f}
.f1{right:7%;top:40%;font-size:38px}
#avatar{position:absolute;z-index:12;left:50%;bottom:8%;width:74px;height:178px;transform:translateX(-50%);filter:drop-shadow(0 8px 5px #0004)}
.head{position:absolute;left:19px;top:15px;width:38px;height:48px;background:var(--skin,#d79b73);border-radius:48% 48% 45% 45%;z-index:4}
.ear{position:absolute;top:31px;width:7px;height:13px;background:var(--skin);border-radius:50%;z-index:3}.ear.l{left:15px}.ear.r{right:14px}
.neck{position:absolute;left:30px;top:57px;width:16px;height:20px;background:var(--skin);z-index:2}
.hairBack{position:absolute;z-index:1;left:18px;top:10px;width:40px;height:70px;background:var(--hair,#35241e);border-radius:50% 50% 35% 35%}
.hairFront{position:absolute;z-index:5;left:18px;top:9px;width:40px;height:20px;background:var(--hair);border-radius:50% 50% 20% 20%}
.eye{position:absolute;z-index:6;top:34px;width:5px;height:4px;background:#332a27;border-radius:50%}.eye.l{left:27px}.eye.r{right:26px}
.body{position:absolute;z-index:3;left:11px;top:72px;width:54px;height:62px;background:var(--scrub,#7054df);clip-path:polygon(10% 0,38% 0,50% 12%,62% 0,90% 0,100% 100%,0 100%)}
.arm{position:absolute;z-index:2;top:77px;width:10px;height:57px;background:var(--skin);border-radius:8px}.arm.l{left:3px}.arm.r{right:3px}
.leg{position:absolute;z-index:2;top:132px;width:19px;height:39px;background:#303946}.leg.l{left:17px}.leg.r{right:17px}
.shoe{position:absolute;z-index:4;top:166px;width:24px;height:10px;background:#25282b;border-radius:5px 5px 2px 2px}.shoe.l{left:12px}.shoe.r{right:12px}
.badge{position:absolute;z-index:6;top:88px;right:14px;width:10px;height:15px;background:#fff;border-radius:2px}
#hud{position:absolute;z-index:30;inset:0;pointer-events:none}
.topbar{position:absolute;top:0;left:0;right:0;height:64px;background:#1f1e20;display:flex;align-items:center;padding:0 16px;font-weight:800;font-size:18px}
.stats{position:absolute;top:76px;left:14px;background:#252526dd;border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.35;box-shadow:0 5px 15px #0003}
.ethics{position:absolute;top:76px;right:12px;display:grid;gap:7px}.pill{background:#252526dd;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}
#arrow{position:absolute;z-index:25;left:50%;top:29%;transform:translateX(-50%);font-size:55px;color:#ffd12f;text-shadow:0 3px 4px #8b6c00;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translate(-50%,8px)}}
#joy{position:absolute;z-index:40;left:24px;bottom:26px;width:110px;height:110px;border:2px solid #ffffffaa;background:#ffffff18;border-radius:50%;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:#ffffffc9;box-shadow:0 3px 10px #0004}
#interact{position:absolute;z-index:40;right:24px;bottom:36px;width:98px;height:98px;border-radius:50%;border:2px solid #ffffffaa;background:#29272780;color:#fff;font-weight:800;pointer-events:auto}
#creator{position:absolute;z-index:100;inset:0;background:#151515d9;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:min(680px,96vw);height:min(790px,92vh);background:#e8e9eb;color:#242426;border-radius:18px;overflow:auto;box-shadow:0 20px 70px #0008}
.panelHead{position:sticky;top:0;z-index:3;background:#4c5056;color:#fff;padding:15px 18px;font-size:20px;font-weight:900}
.preview{height:310px;margin:18px;border-radius:15px;background:radial-gradient(circle at 25% 25%,#ffffff22 0 70px,transparent 71px),linear-gradient(#87929d,#58616b);position:relative;overflow:hidden}
#bigAvatar{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) scale(1.55);transform-origin:bottom}
.options{margin:0 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#f7f7f8;border-radius:13px;padding:13px}
.opt label{display:block;font-weight:800;margin-bottom:8px}
.opt select{width:100%;padding:10px;border-radius:9px;border:1px solid #bbb;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #777}
.continue{margin:0 18px 20px;width:calc(100% - 36px);padding:14px;border:0;border-radius:12px;background:#7054df;color:#fff;font-weight:900;font-size:17px}
.toast{position:absolute;z-index:60;left:50%;bottom:145px;transform:translateX(-50%);background:#1e1e1ed9;padding:10px 14px;border-radius:12px;font-size:13px;display:none}
@media(max-width:520px){.options{grid-template-columns:1fr}.preview{height:285px}.topbar{font-size:16px}.logo{font-size:13px}}
</style>
</head>
<body>
<div id="game">
 <div id="world">
  <div class="ceiling"></div><div class="light l1"></div><div class="light l2"></div><div class="light l3"></div>
  <div class="floor"></div><div class="wallL"><div class="base"></div></div><div class="wallR"><div class="base"></div></div>
  <div class="logo">Hopewell<br>Therapy Clinic<small>HELPING YOU LIVE LIFE</small></div>
  <div class="reception"></div><div class="monitor"></div><div class="plant">🌿</div>
  <div class="door d1"></div><div class="door d2"></div><div class="sign s1">PEDS GYM</div><div class="sign s2">NEURO</div>
  <div class="chairs"><div class="chair"></div><div class="chair"></div><div class="chair"></div></div><div class="frame f1">⌁</div>
  <div id="arrow">⬆</div>
  <div id="avatar" class="avatar">
   <div class="hairBack"></div><div class="ear l"></div><div class="ear r"></div><div class="head"></div><div class="hairFront"></div><div class="eye l"></div><div class="eye r"></div><div class="neck"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div><div class="badge"></div>
  </div>
 </div>
 <div id="hud"><div class="topbar">Hopewell OT Clinic</div><div class="stats"><b>Day 1</b> &nbsp; 8:05 AM<br>⭐ XP <span id="xp">0</span> &nbsp;&nbsp; $<span id="money">0</span></div><div class="ethics"><div class="pill">Ethics 100</div><div class="pill">Safety 100</div></div></div>
 <div id="joy"><div id="knob"></div></div><button id="interact">INTERACT</button><div id="toast" class="toast"></div>
 <div id="creator">
  <div class="panel">
   <div class="panelHead">CREATE YOUR OT</div>
   <div class="preview"><div id="bigAvatar"></div></div>
   <div class="options">
    <div class="opt"><label>Hairstyle</label><select id="hairStyle"><option value="ponytail">Ponytail</option><option value="bun">High bun</option><option value="bob">Bob</option><option value="short">Short</option><option value="waves">Long waves</option></select></div>
    <div class="opt"><label>Eye shape</label><select id="eyeShape"><option>Almond</option><option>Round</option><option>Soft</option><option>Upturned</option></select></div>
    <div class="opt"><label>Skin tone</label><div class="swatches" id="skins"></div></div>
    <div class="opt"><label>Hair color</label><div class="swatches" id="hairs"></div></div>
    <div class="opt"><label>Scrub color</label><div class="swatches" id="scrubs"></div></div>
    <div class="opt"><label>Face</label><select><option>Soft oval</option><option>Oval</option><option>Round</option><option>Angular</option></select></div>
   </div>
   <button class="continue" id="continue">ENTER CLINIC</button>
  </div>
 </div>
</div>
<script>
const avatar=document.getElementById('avatar'), big=document.getElementById('bigAvatar');
big.innerHTML=avatar.innerHTML; big.className='avatar'; big.style.cssText='position:absolute;z-index:12;left:50%;bottom:5%;width:74px;height:178px;transform:translateX(-50%) scale(1.55);transform-origin:bottom';
let skin='#d79b73',hair='#35241e',scrub='#7054df',x=50,y=8,xp=0;
function apply(){
 [avatar,big].forEach(a=>{a.style.setProperty('--skin',skin);a.style.setProperty('--hair',hair);a.style.setProperty('--scrub',scrub)});
}
function swatches(id,vals,setter){let el=document.getElementById(id); vals.forEach(v=>{let b=document.createElement('button');b.className='sw';b.style.background=v;b.onclick=()=>{setter(v);apply()};el.appendChild(b)})}
swatches('skins',['#f0c9aa','#dfa77f','#c58c65','#a86f50','#825139','#5d382a'],v=>skin=v);
swatches('hairs',['#171313','#35241e','#553526','#7b5132','#a66f42','#d3bc91'],v=>hair=v);
swatches('scrubs',['#7054df','#638eb9','#c06e8f','#689878','#3f608c','#8d69a8','#477f83'],v=>scrub=v);
apply();
document.getElementById('hairStyle').onchange=e=>{
 let val=e.target.value;
 [avatar,big].forEach(a=>{
   let hb=a.querySelector('.hairBack'),hf=a.querySelector('.hairFront');
   hb.style.cssText='';hf.style.cssText='';
   if(val==='ponytail'){hb.style.height='85px';hb.style.width='30px';hb.style.left='38px';hb.style.top='18px';hb.style.borderRadius='45% 45% 55% 55%'}
   if(val==='bun'){hb.style.width='30px';hb.style.height='30px';hb.style.left='23px';hb.style.top='0px';hb.style.borderRadius='50%'}
   if(val==='bob'){hb.style.height='65px';hb.style.width='48px';hb.style.left='14px'}
   if(val==='short'){hb.style.height='30px'}
   if(val==='waves'){hb.style.height='100px';hb.style.width='50px';hb.style.left='13px'}
 });
};
document.getElementById('continue').onclick=()=>document.getElementById('creator').style.display='none';
function pos(){avatar.style.left=x+'%';avatar.style.bottom=y+'%'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),active=false;
function move(clientX,clientY){
 let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,d=Math.hypot(dx,dy),m=36;
 if(d>m){dx*=m/d;dy*=m/d}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 x=Math.max(18,Math.min(82,x+dx*.012)); y=Math.max(5,Math.min(42,y-dy*.008)); pos();
 document.getElementById('arrow').style.transform=`translateX(-50%) rotate(${dx>12?90:dx<-12?-90:dy>10?180:0}deg)`;
}
joy.addEventListener('pointerdown',e=>{active=true;joy.setPointerCapture(e.pointerId);move(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(active)move(e.clientX,e.clientY)});
joy.addEventListener('pointerup',()=>{active=false;knob.style.transform='';});
document.getElementById('interact').onclick=()=>{
 if(x<44 && y>20){xp+=10;document.getElementById('xp').textContent=xp;toast('Clocked in ✓  Next: review Maria’s chart');document.getElementById('arrow').textContent='➜'}
 else toast('Move closer to reception');
};
pos();
</script>
</body>
</html>
